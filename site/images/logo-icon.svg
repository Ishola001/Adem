<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="markGrad" x1="6" y1="46" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BD5A2C"/>
      <stop offset="100%" stop-color="#20493C"/>
    </linearGradient>
  </defs>

  <!-- frame -->
  <rect width="64" height="64" rx="17" fill="#FFFFFF"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="none" stroke="#DCE3D8" stroke-width="1.5"/>

  <!-- growth arrow: general marketing/analytics symbol -->
  <g fill="none" stroke="url(#markGrad)" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 33 L21 23 L28 29 L41 15"/>
    <path d="M32 15 L41 15 L41 24"/>
  </g>

  <!-- signal / reach waves, reinforces "marketing" (broadcast + growth) -->
  <g fill="none" stroke="url(#markGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
    <path d="M45 20 C48 17 48 12 45 9"/>
    <path d="M48.5 23.5 C53.5 18.5 53.5 10.5 48.5 5.5"/>
  </g>

  <!-- A&M monogram, nested small inside the frame -->
  <text x="32" y="53" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.5" fill="#182420">A&amp;M</text>
</svg>
