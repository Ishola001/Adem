<svg viewBox="0 0 1100 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF5A36"/><stop offset="100%" stop-color="#0F8B8D"/>
  </linearGradient>
</defs>
<rect width="1100" height="240" fill="#FAFAF9"/>
<line x1="90" y1="130" x2="1010" y2="130" stroke="url(#g)" stroke-width="4"/>
<g font-family="Arial,sans-serif">
  <circle cx="90" cy="130" r="14" fill="#FF5A36"/>
  <text x="90" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#14171F">Stranger</text>
  <text x="90" y="196" text-anchor="middle" font-size="12" fill="#666B78">doesn't know you exist</text>

  <circle cx="550" cy="130" r="14" fill="#F2915C"/>
  <text x="550" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#14171F">Familiar</text>
  <text x="550" y="196" text-anchor="middle" font-size="12" fill="#666B78">recognizes you, still watching</text>

  <circle cx="1010" cy="130" r="14" fill="#0F8B8D"/>
  <text x="1010" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#14171F">Customer</text>
  <text x="1010" y="196" text-anchor="middle" font-size="12" fill="#666B78">trusts you enough to pay</text>
