<svg width="150" height="40" viewBox="0 0 150 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="markGradWide" x1="4" y1="30" x2="34" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BD5A2C"/>
      <stop offset="100%" stop-color="#20493C"/>
    </linearGradient>
  </defs>

  <!-- icon frame -->
  <rect x="0" y="0" width="40" height="40" rx="11" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="10.25" fill="none" stroke="#DCE3D8" stroke-width="1.5"/>

  <!-- growth arrow -->
  <g fill="none" stroke="url(#markGradWide)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 22.5 L14 15.5 L18.5 19.5 L27.5 9.5"/>
    <path d="M21 9.5 L27.5 9.5 L27.5 16"/>
  </g>
  <g fill="none" stroke="url(#markGradWide)" stroke-width="1.3" stroke-linecap="round" opacity="0.75">
    <path d="M30.5 13.5 C32.7 11.3 32.7 7.7 30.5 5.5"/>
  </g>

  <!-- A&M monogram nested in the frame -->
  <text x="20" y="34" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="7" letter-spacing="1" fill="#182420">A&amp;M</text>

  <!-- wordmark -->
  <text x="50" y="26" font-family="'Poppins','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="20" fill="#182420">Adem</text>
</svg>
